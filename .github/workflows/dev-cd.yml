name: Order DEV CD

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Order to DEV
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::828048069567:role/ecommerce-develop-github-actions-role
          aws-region: us-east-1

      - name: Deploy Order using SSM
        id: ssm
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0734295b0b07de1d2" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"echo '=== Starting Order deployment ==='\",
              \"mkdir -p /opt/ecommerce/order\",
              \"aws secretsmanager get-secret-value --secret-id ecommerce/dev/order --region us-east-1 --query SecretString --output text | jq -r 'to_entries[] | \\\"\\(.key)=\\(.value)\\\"' > /opt/ecommerce/order/order.env\",
              \"chmod 600 /opt/ecommerce/order/order.env\",
              \"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 828048069567.dkr.ecr.us-east-1.amazonaws.com\",
              \"docker pull 828048069567.dkr.ecr.us-east-1.amazonaws.com/ecommerce-order:${IMAGE_TAG}\",

              \"echo '=== Running Order database migrations ==='\",
              \"docker run --rm --env-file /opt/ecommerce/order/order.env 828048069567.dkr.ecr.us-east-1.amazonaws.com/ecommerce-order:${IMAGE_TAG} alembic upgrade head\",
              \"echo '=== Order database migrations successful ==='\",


              \"docker stop ecommerce-order || true\",
              \"docker rm ecommerce-order || true\",
              \"docker run -d --name ecommerce-order --network ecommerce-network --restart unless-stopped --env-file /opt/ecommerce/order/order.env -p 8004:8004 828048069567.dkr.ecr.us-east-1.amazonaws.com/ecommerce-order:${IMAGE_TAG}\",
              \"sleep 5\",
              \"curl --fail http://localhost:8004/health\",
              \"echo '=== Order deployment successful ==='\",
              \"docker ps --filter name=ecommerce-order\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "i-0734295b0b07de1d2"

      - name: Show deployment result
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "i-0734295b0b07de1d2" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'