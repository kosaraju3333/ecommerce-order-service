apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ecommerce-order-secrets
  namespace: ecommerce-order
spec:
  provider: aws

  parameters:
    region: us-east-1
    usePodIdentity: "true"
    objects: |
      - objectName: "ecommerce/prod/order"
        objectType: "secretsmanager"
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          - path: SECRET_KEY
            objectAlias: SECRET_KEY
          - path: ALGORITHM
            objectAlias: ALGORITHM
          - path: CART_SERVICE_URL
            objectAlias: CART_SERVICE_URL
          - path: PRODUCT_SERVICE_URL
            objectAlias: PRODUCT_SERVICE_URL
          - path: FRONTEND_URL
            objectAlias: FRONTEND_URL

  secretObjects:
    - secretName: ecommerce-order-credentials
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: SECRET_KEY
          key: SECRET_KEY
        - objectName: ALGORITHM
          key: ALGORITHM
        - objectName: CART_SERVICE_URL
          key: CART_SERVICE_URL
        - objectName: PRODUCT_SERVICE_URL
          key: PRODUCT_SERVICE_URL
        - objectName: FRONTEND_URL
          key: FRONTEND_URL